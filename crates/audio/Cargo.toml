[package]
name = "audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host sound capture (macOS, Windows), Opus coding and viewer playback"

[dependencies]
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.18"
opus = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }
