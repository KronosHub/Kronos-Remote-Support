[package]
name = "capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cross-platform screen capture"

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi"] }
windows-capture = "2"
windesk.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"
