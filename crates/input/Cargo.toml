[package]
name = "input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replays remote mouse/keyboard events on the host"

[dependencies]
anyhow.workspace = true
enigo = "0.6"
protocol.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windesk.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[dev-dependencies]
tracing-subscriber.workspace = true
