[package]
name = "stream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host screen streaming pipeline: capture -> H.264 -> WebRTC video track"

[dependencies]
anyhow.workspace = true
arboard = "3"
base64 = "0.22"
bytes = "1"
# Same version as arboard's: copied pictures travel as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
agent.workspace = true
audio.workspace = true
capture.workspace = true
codec.workspace = true
input.workspace = true
protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_DataExchange", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSArray", "NSGeometry"] }

[dev-dependencies]
signaling-proto.workspace = true
