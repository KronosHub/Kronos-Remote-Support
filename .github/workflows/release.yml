# Builds Kronos Remote Support at a tag and publishes the installers + latest.json
# (in-app updater, ADR 0023) as a release of this repository. Manual trigger only:
#   gh workflow run release.yml -R KronosHub/Kronos-Remote-Support -f tag=v1.2.1
# With -f draft_only=true the release stays a draft (installers to test before publishing).
#
# One job creates the release as a draft, the four builds upload into it, and the last job
# publishes it once they all succeed. Before, every build created the release on its own and two
# of them could create it at the same second (v1.8.2: Windows files in a second copy).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) to sign update packages,
# APPLE_CERTIFICATE(+_PASSWORD), APPLE_SIGNING_IDENTITY, KEYCHAIN_PASSWORD for macOS code signing
# (self-signed stable identity, imported by hand: Tauri's own import rejects untrusted certs).
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.2.1)
        required: true
      draft_only:
        description: Leave the release as a draft (to test the installers first)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # Release notes = CHANGELOG.md from this version's section down (10 versions), so the
      # app can show every change newer than the installed version. Fails without a section.
      - name: Draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            /^## / { if (!on && ($2 == v)) on = 1; if (on && ++n > 10) exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          {
            echo 'Si installa dal pulsante "Aggiornamenti" nell'"'"'app.'
            echo 'Kronos Quick Support (file KronosQuickSupport_*): versione senza installazione per farsi assistere.'
            echo 'KronosVirtualMonitor.exe: monitor virtuale 1920×1080 per PC Windows senza monitor (si installa anche dall'"'"'app, sezione Aggiornamenti).'
            echo
            cat notes.md
          } > body.md
          # A re-run reuses the release of this tag (draft or not) instead of making another.
          # The id of a new one comes from the create call: a fresh draft is not always listed yet.
          # The tag exists (checked out above), so creating the release never makes a new tag.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name == \"$TAG\") | .id" | sed -n 1p)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" \
              -f name="Kronos Remote Support $TAG" -F body=@body.md -F draft=true -q .id)
          fi
          [ -n "$id" ] || { echo "::error::no release for $TAG"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: System dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf nasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch (2026-10-09)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      # NASM: OpenH264 (the encoder without a media engine) is built with its x86 assembly
      # only if `nasm` is found; without it the x64 builds encode several times slower.
      - name: NASM (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: NASM (macOS Intel)
        if: matrix.rust_targets == 'x86_64-apple-darwin'
        run: brew install nasm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Builds cached before NASM was installed have OpenH264 without assembly.
          prefix-key: v1-nasm
      # macOS: the minimal FFmpeg for hardware encoding (ADR 0058), cached per target and
      # build script/patch; the app falls back to OpenH264 without it.
      - name: FFmpeg cache (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ matrix.rust_targets }}-${{ hashFiles('tools/ffmpeg/**') }}
      - name: FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ffmpeg"
          [ -f "$dir/lib/libavcodec.a" ] || tools/ffmpeg/build.sh "${{ matrix.rust_targets }}" "$dir"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
      # Windows: the same minimal FFmpeg with Media Foundation, built with MSVC from the
      # MSYS2 shell of the runner (ADR 0058). MSVC is set up for this step only: exported to
      # the others it would make rustc pick Git's link.exe.
      - name: FFmpeg cache (Windows)
        if: startsWith(matrix.platform, 'windows')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ffmpeg
          key: ffmpeg-x86_64-pc-windows-msvc-${{ hashFiles('tools/ffmpeg/**') }}
      - name: FFmpeg (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          if (-not (Test-Path "$dir\lib\avcodec.lib")) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
            $env:MSYS2_PATH_TYPE = 'inherit'
            $env:CHERE_INVOKING = '1'
            cmd /c "call `"$vcvars`" && C:\msys64\usr\bin\bash.exe -lc `"tools/ffmpeg/ci-windows.sh '$dir'`""
            if ($LASTEXITCODE) { exit 1 }
          }
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      # Stable (self-signed) code signing identity: macOS then recognises every update as
      # the same app and keeps its Screen Recording / Accessibility permissions (ADR 0027).
      # Not a Developer ID, so Gatekeeper still warns on the first download.
      - name: Import macOS signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc"
      # The draft's notes also go into latest.json, where the app reads them.
      - name: Release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo 'body<<EOF_NOTES'
            gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" -q .body
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"
      # Windows: the virtual monitor program (ADR 0049), bundled in the installer (app updates
      # bring its new versions) and published on its own for PCs without the app.
      - name: Virtual monitor program (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          tools/virtual-monitor/fetch-driver.sh
          cargo build --release -p virtual-monitor
          mkdir -p apps/desktop/src-tauri/resources/virtual-monitor
          cp target/release/KronosVirtualMonitor.exe apps/desktop/src-tauri/resources/virtual-monitor/
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: sign with the stable identity imported above (only the name is passed,
          # so Tauri does not re-import and reject the self-signed certificate).
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          projectPath: apps/desktop
          # The draft made by the first job; the tag turns its "untagged" links into real ones.
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Quick access (ADR 0031): share-only build, no installer. Windows: the bare .exe;
      # macOS: the signed .app zipped; Linux: an AppImage.
      - name: Quick access build
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) bundles="--bundles app" ;;
            Linux) bundles="--bundles appimage" ;;
            Windows) bundles="--no-bundle" ;;
          esac
          npx tauri build --config src-tauri/tauri.quick.conf.json --features quick-access $bundles ${{ matrix.args }}
          version="${TAG#v}"
          out="../../target/${{ matrix.rust_targets }}/release"
          [ -n "${{ matrix.rust_targets }}" ] || out="../../target/release"
          case "$RUNNER_OS" in
            macOS)
              arch=$([ "${{ matrix.rust_targets }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
              file="KronosQuickSupport_${version}_macos_${arch}.zip"
              ditto -c -k --keepParent "$out/bundle/macos/Kronos Quick Support.app" "$file" ;;
            Linux)
              file="KronosQuickSupport_${version}_linux_amd64.AppImage"
              cp "$out"/bundle/appimage/*.AppImage "$file" ;;
            Windows)
              file="KronosQuickSupport_${version}_windows_x64.exe"
              cp "$out/kronos-quick-support.exe" "$file"
              # The virtual monitor program on its own (built in the step above).
              cp "$out/KronosVirtualMonitor.exe" KronosVirtualMonitor.exe
              gh release upload "$TAG" KronosVirtualMonitor.exe --clobber -R "${{ github.repository }}" ;;
          esac
          gh release upload "$TAG" "$file" --clobber -R "${{ github.repository }}"

  publish:
    needs: [release, desktop]
    if: ${{ !inputs.draft_only }}
    runs-on: ubuntu-latest
    steps:
      # Each build merges its platforms into latest.json: check none was lost before the
      # apps can see the version (4 builds: 11 platforms).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json
          count=$(jq '.platforms | length' latest.json)
          [ "$count" -ge 11 ] || { echo "::error::latest.json has $count platforms, expected 11: release left as a draft"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}" \
            -F draft=false -f make_latest=true --jq '.html_url'
