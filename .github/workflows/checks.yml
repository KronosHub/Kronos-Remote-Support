# Format, lint, tests and end-to-end run, plus capture/input smoke tests on Linux (X11)
# and Windows. Runs on pushes to main and on pull requests; manual run:
#   gh workflow run checks.yml -R KronosHub/Kronos-Remote-Support -f ref=main
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit
        required: true
        default: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch (2026-10-09)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Frontend build (Tauri embeds it at compile time)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/e2e-local.sh

  # Hardware encoding (ADR 0058): FFmpeg, the C layer and the native capture path. Runners
  # are virtual machines: the encoder test skips itself when there is no media engine.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch (2026-10-09)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-aarch64-apple-darwin-${{ hashFiles('tools/ffmpeg/**') }}
      - name: FFmpeg
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ffmpeg"
          [ -f "$dir/lib/libavcodec.a" ] || tools/ffmpeg/build.sh aarch64-apple-darwin "$dir"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
      - run: cargo clippy -p codec -p capture -p stream -p capture-poc --all-targets -- -D warnings
      - run: cargo test -p codec -p capture

  linux-x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-xserver-utils xclip
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch (2026-10-09)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p capture-poc
      - run: cargo build --release -p input --example smoke
      - name: Capture + input on a virtual X display
        run: |
          # -noreset: otherwise the server resets (pointer back to centre) whenever the
          # last client disconnects, e.g. right after the input test exits.
          Xvfb :99 -screen 0 1280x720x24 -noreset &
          export DISPLAY=:99 XDG_SESSION_TYPE=x11
          sleep 2
          (for i in $(seq 1 20); do xsetroot -solid "#$(printf '%02x%02x80' $((i*12)) $((255-i*12)))"; sleep 0.1; done) &
          mover=$!
          ./target/release/capture-poc --seconds 2 --output x11.h264 | tee capture.log
          grep -E "frames encoded +([2-9]|[1-9][0-9])" capture.log
          wait $mover
          ./target/release/examples/smoke 0.25 0.5
          eval "$(xdotool getmouselocation --shell)"
          echo "pointer at $X,$Y"
          test "$X" -ge 318 -a "$X" -le 322 -a "$Y" -ge 358 -a "$Y" -le 362
      - name: Shared clipboard (text and files) between two X displays
        run: ./scripts/e2e-clipboard-x11.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch (2026-10-09)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Windows: the same minimal FFmpeg with Media Foundation, built with MSVC from the
      # MSYS2 shell of the runner (ADR 0058). MSVC is set up for this step only: exported to
      # the others it would make rustc pick Git's link.exe.
      - name: FFmpeg cache (Windows)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ffmpeg
          key: ffmpeg-x86_64-pc-windows-msvc-${{ hashFiles('tools/ffmpeg/**') }}
      - name: FFmpeg (Windows)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          if (-not (Test-Path "$dir\lib\avcodec.lib")) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
            $env:MSYS2_PATH_TYPE = 'inherit'
            $env:CHERE_INVOKING = '1'
            cmd /c "call `"$vcvars`" && C:\msys64\usr\bin\bash.exe -lc `"tools/ffmpeg/ci-windows.sh '$dir'`""
            if ($LASTEXITCODE) { exit 1 }
          }
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo build --release -p agent -p windesk
      # Sound (Opus + WASAPI): the Windows code paths only build here and in the release.
      - run: cargo clippy -p audio -p stream --all-targets -- -D warnings
      - run: cargo test --release -p audio
      # The hardware encoder (Media Foundation); skips itself on runners without a GPU.
      - run: cargo test --release -p codec
      # Virtual monitor program (ADR 0049) and the app's Windows code, which otherwise only
      # builds in the release.
      - name: Virtual monitor and app (Windows)
        shell: bash
        run: |
          set -euo pipefail
          tools/virtual-monitor/fetch-driver.sh
          cargo clippy -p virtual-monitor --all-targets -- -D warnings
          cargo build --release -p virtual-monitor
          mkdir -p apps/desktop/src-tauri/resources/virtual-monitor apps/desktop/build
          cp target/release/KronosVirtualMonitor.exe apps/desktop/src-tauri/resources/virtual-monitor/
          [ -f apps/desktop/build/index.html ] || echo '<!doctype html>' > apps/desktop/build/index.html
          cargo clippy -p desktop-remoto --all-targets -- -D warnings
      - run: cargo build --release -p capture-poc
      - run: cargo build --release -p input --example smoke
      - name: Capture (DXGI duplication)
        shell: pwsh
        run: ./target/release/capture-poc.exe --seconds 2 --output win.h264
      - name: Input (SendInput)
        shell: pwsh
        run: |
          ./target/release/examples/smoke.exe 0.25 0.5
          Add-Type -AssemblyName System.Windows.Forms
          $p = [System.Windows.Forms.Cursor]::Position
          $s = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "pointer at $($p.X),$($p.Y) on $($s.Width)x$($s.Height)"
          $ex = [math]::Round(0.25 * ($s.Width - 1)); $ey = [math]::Round(0.5 * ($s.Height - 1))
          if ([math]::Abs($p.X - $ex) -gt 2 -or [math]::Abs($p.Y - $ey) -gt 2) { throw "pointer not moved" }
