<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kronos Remote Support (ADR 0071, proposal C4.4): your screen behind, the partner's monitor in front
       with the Kronos "K", on a white squircle tile with an orange rim -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#ffffff"/>
  <!-- Orange rim, inside the tile -->
  <rect x="108" y="108" width="808" height="808" rx="177" fill="none" stroke="#f39200" stroke-width="16"/>

  <!-- Screen behind: orange outline -->
  <rect x="222" y="226" width="420" height="300" rx="40" fill="none" stroke="#f39200" stroke-width="34"/>

  <!-- Monitor in front: black frame (white gap over the screen behind), white screen, stand -->
  <rect x="380" y="400" width="440" height="300" rx="44" fill="#111111" stroke="#ffffff" stroke-width="30"/>
  <rect x="410" y="430" width="380" height="240" rx="20" fill="#ffffff"/>
  <rect x="574" y="712" width="52" height="54" fill="#111111"/>
  <rect x="496" y="756" width="208" height="38" rx="19" fill="#111111"/>

  <!-- K: black bar + orange chevron -->
  <rect x="508" y="470" width="52" height="160" rx="6" fill="#111111"/>
  <polygon points="692,470 638,470 578,550 638,630 692,630 632,550" fill="#f39200"/>
</svg>
